<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — ExamPortal</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>

  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-icon">✏️</div>
        <h2>Create Account</h2>
        <p class="subtitle">Join ExamPortal as a student</p>
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="e.g. Arjun Kumar" autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="arjun@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 20" min="18" max="60">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password">
      </div>

      <button class="btn btn-success" onclick="handleRegister()" id="registerBtn">Create Account →</button>
      <div id="message" class="message"></div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    initTheme();

    async function handleRegister() {
      const name     = document.getElementById("name").value.trim();
      const email    = document.getElementById("email").value.trim();
      const age      = parseInt(document.getElementById("age").value);
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("registerBtn");

      if (!name || !email || !age || !password) { showMsg("Please fill in all fields.", "error"); return; }
      if (age < 18 || age > 60)                 { showMsg("Age must be between 18 and 60.", "error"); return; }
      if (password.length < 6)                  { showMsg("Password must be at least 6 characters.", "error"); return; }

      btn.textContent = "Creating account..."; btn.disabled = true;

      try {
        const student = await registerUser({ name, email, age, password });

        if (student?.id) {
          localStorage.setItem("studentId",    student.id);
          localStorage.setItem("studentName",  student.name);
          localStorage.setItem("studentEmail", student.email);
        }

        showMsg("Account created! Redirecting to login...", "success");
        setTimeout(() => window.location.href = "login.html", 1200);
      } catch (err) {
        showMsg(err.message || "Registration failed.", "error");
        btn.textContent = "Create Account →"; btn.disabled = false;
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById("message");
      el.textContent = text; el.className = "message " + type;
    }
  </script>
</body>
</html>
